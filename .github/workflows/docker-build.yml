name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Files that never reach the image; a change to only these skips the build
    paths-ignore: &not-in-image
      - '**.md'
      - LICENSE
      - .editorconfig
      - .gitignore
      - compose.yml
  pull_request:
    branches:
      - main
    paths-ignore: *not-in-image
  schedule:
    # Weekly check for a new Beeper Desktop release: Mondays 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest Beeper Desktop version
        id: beeper
        run: |
          url=$(curl -fsS -o /dev/null -w '%{redirect_url}' \
            https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop)
          version=$(printf '%s' "$url" | sed -n 's|.*/Beeper-\([0-9.]*\)-x86_64\.AppImage$|\1|p')
          if [ -z "$version" ]; then
            echo "Could not resolve the Beeper version from '$url'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Beeper Desktop $version"

      - name: Skip scheduled build when this version is already published
        id: existing
        if: github.event_name == 'schedule'
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:${{ steps.beeper.outputs.version }}"
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' && steps.existing.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.existing.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.beeper.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          labels: |
            org.opencontainers.image.version=${{ steps.beeper.outputs.version }}

      - name: Build and push amd64 Docker image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BEEPER_VERSION=${{ steps.beeper.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
